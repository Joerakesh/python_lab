name: Execute Python lab notebooks

on:
  push:
    paths:
      - "ex-*/*.ipynb"
      - "ex-*/*.py"
      - "requirements.txt"
      - ".github/workflows/execute-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-lab-notebooks
  cancel-in-progress: true

jobs:
  execute:
    # Do not rerun the job in response to the bot's own output commit.
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute all exercise notebooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p executed-notebooks
          while IFS= read -r notebook; do
            exercise="$(basename "$(dirname "$notebook")")"
            echo "Executing $notebook"
            jupyter nbconvert --to notebook --execute "$notebook" \
              --output "${exercise}.ipynb" \
              --output-dir executed-notebooks \
              --ExecutePreprocessor.timeout=300
            cp "executed-notebooks/${exercise}.ipynb" "$notebook"
            echo "- Passed: `$exercise`" >> "$GITHUB_STEP_SUMMARY"
          done < <(find ex-* -maxdepth 1 -type f -name '*.ipynb' | sort)
          echo "All exercise notebooks executed successfully."
      - name: Commit executed notebooks with outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_sha="$(git rev-parse HEAD)"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3: fetching latest main..."
            git fetch origin main
            if git diff --name-only "$source_sha" origin/main -- 'ex-*/*.ipynb' | grep -q .; then
              echo "Notebook source changed while execution was running; leaving outputs in the artifact only."
              exit 0
            fi

            git reset --mixed origin/main
            git add ex-*/*.ipynb
            if git diff --cached --quiet; then
              echo "No notebook output changes to commit."
              exit 0
            fi
            git commit -m "Add executed Python lab notebook outputs"
            if git push origin HEAD:main; then
              echo "Executed notebook outputs pushed successfully."
              exit 0
            fi
            echo "Push raced with another update; retrying."
          done

          echo "Could not push notebook outputs after 3 attempts; artifact upload will still run."
          exit 1
      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-python-lab-notebooks
          path: executed-notebooks/
          if-no-files-found: warn
          retention-days: 14
